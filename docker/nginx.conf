# nginx untuk Laravel + Inertia. File bawaan Debian (/etc/nginx/nginx.conf)
# sengaja ditimpa supaya self-contained: tidak ikut memuat sites-enabled
# dan tidak perlu daemon-management (daemon off; dijalankan supervisor).
user www-data;
worker_processes auto;
pid /run/nginx.pid;
daemon off;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    types_hash_max_size 2048;

    # Foto bukti pemeriksaan di-upload lewat form task; samakan dengan
    # upload_max_filesize / post_max_size di docker/app.ini.
    client_max_body_size 26M;
    client_body_timeout 120s;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        image/svg+xml font/woff font/woff2;

    server {
        # Sengaja tanpa `listen [::]:80`: kalau network Docker tidak
        # mengaktifkan IPv6, bind IPv6 bikin nginx langsung exit.
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        # Kalau user lupa ketik https:// (misal langsung 192.168.1.198:8443),
        # otomatis redirect ke https:// daripada tampil 400 Bad Request.
        error_page 497 =307 https://$http_host$request_uri;

        root /var/www/html/public;
        index index.php index.html;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Asset hasil `npm run build` (public/build) diberi hash oleh Vite,
        # jadi boleh di-cache lama.
        location ^~ /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Foto pertanyaan + bukti upload (storage:link ke storage/app/public).
        # Jangan pernah di-cache permanen: file bisa dihapus/ganti nama.
        location ^~ /storage/ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            # WAJIB kalau app diakses lewat port yang dipetakan Docker.
            # Docker memetakan port host 8000 -> port 80 di dalam container, dan
            # DNAT itu tidak terlihat oleh nginx: SERVER_PORT yang dikirim ke PHP
            # selalu 80. Symfony lalu menganggap port sudah default sehingga
            # MEMBUANG port dari semua URL absolute: aset jadi
            # http://192.168.1.198/build/... (404 + diblok CORS -> halaman blank),
            # dan link di dalam QR code ikut kehilangan :8000.
            # Host yang dikirim browser selalu berisi port asli (192.168.1.198:8000),
            # jadi teruskan apa adanya sebagai X-Forwarded-Host. Header ini hanya
            # akan dipakai karena bootstrap/app.php menyetel
            # $middleware->trustProxies(at: '*').
            # Nilai inbound dari proxy luar sengaja ditimpa, bukan diteruskan.
            fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            # $realpath_root supaya open_basedir/symlink (public/storage) aman.
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_read_timeout 130;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 16 16k;
        }

        location = /favicon.ico { log_not_found off; access_log off; }
        location = /robots.txt { log_not_found off; access_log off; }

        # /up dipakai HEALTHCHECK Docker (bootstrap/app.php -> health: '/up').
        location = /up {
            access_log off;
        }

        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
