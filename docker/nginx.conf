# nginx untuk Laravel + Inertia. File bawaan Debian (/etc/nginx/nginx.conf)
# sengaja ditimpa supaya self-contained: tidak ikut memuat sites-enabled
# dan tidak perlu daemon-management (daemon off; dijalankan supervisor).
user www-data;
worker_processes auto;
pid /run/nginx.pid;
daemon off;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    types_hash_max_size 2048;

    # Foto bukti pemeriksaan di-upload lewat form task; samakan dengan
    # upload_max_filesize / post_max_size di docker/app.ini.
    client_max_body_size 26M;
    client_body_timeout 120s;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        image/svg+xml font/woff font/woff2;

    server {
        # Sengaja tanpa `listen [::]:80`: kalau network Docker tidak
        # mengaktifkan IPv6, bind IPv6 bikin nginx langsung exit.
        listen 80 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php index.html;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Asset hasil `npm run build` (public/build) diberi hash oleh Vite,
        # jadi boleh di-cache lama.
        location ^~ /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Foto pertanyaan + bukti upload (storage:link ke storage/app/public).
        # Jangan pernah di-cache permanen: file bisa dihapus/ganti nama.
        location ^~ /storage/ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            # $realpath_root supaya open_basedir/symlink (public/storage) aman.
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_read_timeout 130;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 16 16k;
        }

        location = /favicon.ico { log_not_found off; access_log off; }
        location = /robots.txt { log_not_found off; access_log off; }

        # /up dipakai HEALTHCHECK Docker (bootstrap/app.php -> health: '/up').
        location = /up {
            access_log off;
        }

        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
