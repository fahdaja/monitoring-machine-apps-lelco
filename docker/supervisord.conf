; Config supervisord utama untuk image ini. File ini MENIMPA bawaan Debian
; (/etc/supervisor/supervisord.conf) supaya tidak ada perilaku yang diam-diam
; berubah kalau paket supervisor di base image di-update:
;   - nodaemon=true -> tetap foreground, wajib untuk PID 1 container
;   - semua log ke stdout/stderr -> tertangkap `docker compose logs`
;
; Kontrol manual dari dalam container:
;   docker compose exec app supervisorctl status
;   docker compose exec app supervisorctl restart scheduler

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/run/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:php-fpm]
; Tanpa -y/-c: biarkan php-fpm pakai default image (/usr/local/etc/php-fpm.conf)
; yang meng-include /usr/local/etc/php-fpm.d/*.conf. Kalau -y ditunjuk langsung
; ke www.conf, override zz-app.conf (clear_env dll) tidak ikut terbaca.
command=/usr/local/sbin/php-fpm -F
priority=1
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=QUIT
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /etc/nginx/nginx.conf
priority=2
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=QUIT
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; routes/console.php: tasks:generate 00:00 + tasks:mark-due 00:01 (Asia/Jakarta,
; lihat config/app.php). Tanpa proses ini task terjadwal tidak pernah dibuat dan
; tenggat tidak pernah berubah — fitur jadwal kelihatan "mati" di container.
; schedule:work = versi foreground dari cron `* * * * * php artisan schedule:run`.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
priority=10
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; JANGAN jalankan container app lebih dari 1 replika dengan proses ini aktif.
; tasks:generate dobel masih aman (idempotency_key Fase 1 menolak task ganda),
; tapi log jadi dobel dan DB bekerja percuma. Untuk multi-replika, pisahkan
; scheduler ke service sendiri memakai image yang sama.
[group:app]
programs=php-fpm,nginx,scheduler
priority=100
