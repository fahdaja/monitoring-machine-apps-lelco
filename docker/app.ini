; Config PHP untuk container ini. File di conf.d dimuat setelah php.ini
; bawaan image, jadi isinya menimpa default.
memory_limit = 256M

; Upload bukti foto (evidence photos) & gambar pertanyaan lewat
; TaskController::uploadFile / FormController. nginx juga punya
; client_max_body_size sendiri di docker/nginx.conf.
upload_max_filesize = 24M
post_max_size = 26M
max_file_uploads = 40
max_input_vars = 10000

max_execution_time = 120

; config/app.php memakai Asia/jakarta; disamakan supaya log & cron konsisten.
date.timezone = Asia/Jakarta

expose_php = Off
display_errors = Off
log_errors = On

; Aman karena kode dibake ke image: setiap deploy = image baru = cache baru.
; Kalau nanti lu bind-mount source buat dev, matikan baris validate_timestamps.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.cookie_httponly = 1
