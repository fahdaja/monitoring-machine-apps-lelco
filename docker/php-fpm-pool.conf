; Override pool www.conf. Nama file diawali "zz-" supaya dimuat TERAKHIR oleh
; glob include=/usr/local/etc/php-fpm.d/*.conf (www.conf dibaca duluan, jadi
; nilai di sini yang menang). Penamaan ini mengikuti pola zz-docker.conf
; bawaan image php:8.3-fpm.
[www]

; PENTING. Default php-fpm = yes, dan itu menghapus seluruh variable container
; dari worker. Akibatnya Laravel kehilangan DB_*, APP_*, SESSION_* dan halaman
; langsung 500 "Database connection [none]". Dengan no, env dari compose lolos
; ke worker (termasuk APP_KEY yang diekspor entrypoint).
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Log worker dibuang ke stderr supervisor apa adanya, tanpa prefix noise.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

; Sedikit di atas max_execution_time PHP (120s) supaya submit form berisi
; banyak foto / kondisi trigger tidak dipotong FPM lebih dulu.
request_terminate_timeout = 130
